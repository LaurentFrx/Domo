# Secrets requis dans Settings → Secrets → Actions :
#   VPS_HOST    = 204.168.129.228
#   VPS_USER    = laurent
#   VPS_SSH_KEY = clé privée d'une deploy key dédiée
#                 Générer : ssh-keygen -t ed25519 -f ~/.ssh/domo_deploy -N ""
#                 Ajouter la .pub dans /home/laurent/.ssh/authorized_keys
#
# Prérequis VPS (mis en place par scripts/bootstrap-vps.sh) :
#  - Node 20+ et pnpm installés (NodeSource + npm -g)
#  - Service systemd `domo` installé et activé
#  - /etc/sudoers.d/domo-deploy donne à laurent NOPASSWD sur
#    /bin/systemctl restart domo et /bin/systemctl reload caddy
name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/laurent/domo
            git fetch --prune origin
            # Filet de sûreté. Le dossier de prod est aussi un dépôt git : la moindre
            # modif non commitée y fait échouer `git checkout -B` et bloque TOUS les
            # déploiements suivants (arrivé le 04/08/2026, runs #268 et #269 — le
            # service reste alors en vie sur une vieille version, sans rien signaler).
            # On la met de côté au lieu de mourir. `stash push -u` ne touche pas les
            # fichiers ignorés : .env et data/ (état vivant) sont saufs.
            if [ -n "$(git status --porcelain)" ]; then
              echo "[deploy] ⚠ modifications locales dans /home/laurent/domo — mises de côté :"
              git status --short
              git stash push -u -m "auto-deploy $(git rev-parse --short origin/main)"
              # `pop` peut conflicter si le travail local recouvrait l'amont ; l'entrée
              # de stash est alors conservée, donc rien n'est jamais perdu.
              echo "[deploy] rien n'est perdu — inspecter : cd /home/laurent/domo && git stash list && git stash show -p stash@{0}"
            fi
            git checkout -B main origin/main
            pnpm install --frozen-lockfile
            pnpm build
            sudo systemctl restart domo
            sleep 2
            systemctl is-active --quiet domo || (journalctl -u domo -n 20 --no-pager; exit 1)
            curl -fsS --max-time 10 http://127.0.0.1:3000/ -o /dev/null && echo "[deploy] domo actif et répond HTTP 200"
